[package]
name = "contract-2026v1-identyclaw-com-near"
version = "0.2.0"
edition = "2021"
authors = ["Your Name <org@rodit.org>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = { version = "=5.14.0", default-features = false, features = ["legacy", "__macro-docs"] }
borsh = { version = "1.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
miniserde = "0.1"
ed25519-dalek = "1.0.1"
base64 = "0.13.0"
regex = "1.5.4"
lazy_static = "1.4.0"
sha2 = "0.10.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
near-sdk = { version = "=5.14.0", default-features = false, features = ["abi", "unstable", "schemars"] }
schemars = "0.8.15"
near-abi = "0.4.3"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
members = []

[dev-dependencies]
rand = "0.8.5"
near-sdk = { version = "5.5.0", features = ["legacy", "unit-testing"] }
